name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Com domínio próprio (arquivo public/CNAME) o site fica na raiz; sem ele, em /nome-do-repo/ no github.io.
      - name: Definir endereço
        run: |
          if [ -f public/CNAME ]; then
            echo "BASE_PATH=/" >> $GITHUB_ENV
            echo "SITE_URL=https://$(tr -d '[:space:]' < public/CNAME)" >> $GITHUB_ENV
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "BASE_PATH=/$REPO/" >> $GITHUB_ENV
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO" >> $GITHUB_ENV
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
