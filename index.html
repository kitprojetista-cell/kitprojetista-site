    <script>
      // Quem vem de fora (navegador sem português) abre a página em inglês, com os preços em dólar.
      // Só na página inicial; robôs de busca não são redirecionados; a escolha feita no botão PT/EN vale sempre.
      (function () {
        try {
          var p = location.pathname;
          if (p !== '/' && p !== '/index.html') return;
          if (/bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegram|preview/i.test(navigator.userAgent)) return;
          var escolha = null;
          try { escolha = localStorage.getItem('kp-idioma'); } catch (e) {}
          if (escolha === 'pt') return;
          var linguas = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          var pt = false;
          for (var i = 0; i < linguas.length; i++) if (/^pt/i.test(linguas[i])) pt = true;
          if (escolha === 'en' || !pt) {
            var h = location.hash === '#planos' ? '#plans' : location.hash === '#contato' ? '#contact' : location.hash === '#recursos' ? '#features' : '';
            location.replace('/en/' + h);
          }
        } catch (e) {}
      })();
    </script>
